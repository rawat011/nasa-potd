name: API Automation Suite

on: [push]

jobs:
  api-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests datetime streamlit

      - name: Run API Tests
        # This injects your secret token from GitHub into the environment
        env:
          API_TOKEN: ${{ secrets.API_TOKEN }}
        run: |
          timeout 1m streamlit run main.py

      - name: Upload Test Report
        if: always() # This ensures the report uploads even if a test fails
        uses: actions/upload-artifact@v4
        with:
          name: api-test-results
          path: report.html